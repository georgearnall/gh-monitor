name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-go caches ~/go/pkg/mod and ~/.cache/go-build, keyed on
      # go.sum. The precompile action picks up the already-installed Go,
      # so each release run skips the dependency downloads after the
      # first cache fill.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
